name: Build Komari Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-gpu-${VERSION}-komari.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-gpu-${{ steps.meta.outputs.version }}-komari
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 GPU v${VERSION}

          基于 Tasogare v1.2.2 整合并增强。

          ### 本次更新
          - 节点卡片按新的信息层级重新布局，顶部显示完整系统版本与架构。
          - 新增 ASN 与 IPv4/IPv6 归属信息，通过节点标签 asn:、ipv4:、ipv6: 提供公开元数据。
          - 新增上行、实时总速率、下行，以及累计上传、累计下载、在线时长。
          - 新增到期时间、流量重置日和费用金额信息区。
          - CPU、内存、硬盘、周期流量改为 2×2 资源布局。
          - 保留 TCP/UDP、延迟/丢包、GPU/iGPU、流量周期、访问 IP 及现有点击弹窗功能。

          ### 安装
          下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          EOF

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Node Card Network Info" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Node Card Network Info" \
              --notes-file release-notes.md
          fi
