name: Build Komari Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-gpu-${VERSION}-komari.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-gpu-${{ steps.meta.outputs.version }}-komari
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 GPU v${VERSION}

          基于 Tasogare v1.2.2 整合并增强。

          ### 本次更新
          - 基于 v2.2.2 的 TCPing Footer Spacing 布局继续增强节点卡片底部信息区。
          - 在底部实时上下行网速与在线时长之间新增服务器费用显示。
          - 费用直接读取 Komari 节点的价格、币种与计费周期，例如 C\$40/月、\$5/月、€10/年。
          - 未配置价格的节点自动隐藏费用，不额外占用底部空间。
          - 保留 v2.2.2 的 TCPing 底部安全间距、窄屏布局和高 DPI 修复。
          - 保留自选延迟、丢包状态条、TCP/UDP 连接数、剩余价值、GPU/iGPU、按月流量周期和访问 IP 等现有功能。

          ### 安装
          下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping the published asset unchanged."
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Billing Footer" \
              --notes-file release-notes.md
          fi
