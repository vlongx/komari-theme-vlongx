name: Build Komari Theme

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Verify theme ZIP manifest at archive root
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-gpu-${VERSION}-komari.zip"
          python3 -c 'import json,sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); assert "komari-theme.json" in names, names; assert "dist/index.html" in names; json.loads(z.read("komari-theme.json"))' "$ZIP"

      - name: Validate optional node metadata plugin
        run: |
          node --check plugins/node-network-meta/script.js
          node tests/node-network-meta.test.cjs

      - name: Package optional node metadata plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLUGIN_ZIP="komari-node-network-meta-plugin-${VERSION}.zip"
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1],"w",zipfile.ZIP_DEFLATED); z.write("plugins/node-network-meta/komari-plugin.json","komari-plugin.json"); z.write("plugins/node-network-meta/script.js","script.js"); z.close()' "$PLUGIN_ZIP"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-gpu-${VERSION}-komari.zip"
          PLUGIN_ZIP="komari-node-network-meta-plugin-${VERSION}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "plugin_zip=$PLUGIN_ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-gpu-${{ steps.meta.outputs.version }}-komari
          path: |
            ${{ steps.meta.outputs.zip }}
            ${{ steps.meta.outputs.plugin_zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
          PLUGIN_ZIP: ${{ steps.meta.outputs.plugin_zip }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 GPU v${VERSION}

          基于 Tasogare v1.2.2 整合并增强。

          ### 自动 ASN 与 IP 国家归属
          - 主题自动读取可选服务端插件返回的 ASN、IPv4/IPv6 国家信息。
          - 服务端插件使用 Komari 保存的节点 IP 进行查询，不会把原始 IP 输出到公共 API。
          - 自动信息可通过节点 Tag 覆盖；插件未安装或识别失败时仍保留“待配置”提示。
          - 保持系统信息、GPU/iGPU、延迟/丢包、流量周期及 v2.2.5 界面结构。

          ### 安装
          主题：下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          自动 ASN/IP：插件 ZIP 移至独立 prerelease v${VERSION}-plugin，不与主题 ZIP 混放。请在插件管理安装 \`${PLUGIN_ZIP}\`。插件使用第三方 ipapi.is 查询服务器公网 IP。
          EOF

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          # Komari imports the FIRST asset of latest release, including when
          # a GitHub asset download URL was supplied. Theme releases must contain
          # exactly one asset: the ZIP with komari-theme.json at the archive root.
          PLUGIN_TAG="${TAG}-plugin"
          cat > plugin-release-notes.md <<EOF
          ## Optional ASN / IP country lookup plugin for v${VERSION}

          This is a server-side Komari plugin, NOT a theme ZIP.
          Install \`${PLUGIN_ZIP}\` in Komari plugin management.
          Plugin may send each node's public IP to api.ipapi.is for ASN/country lookup.
          EOF

          # Publish the optional plugin separately as a prerelease, so GitHub's
          # releases/latest endpoint always resolves to the THEME-only release.
          if gh release view "$PLUGIN_TAG" >/dev/null 2>&1; then
            gh release edit "$PLUGIN_TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "v${VERSION} — Optional Network Metadata Plugin" \
              --notes-file plugin-release-notes.md
            gh release upload "$PLUGIN_TAG" "$PLUGIN_ZIP" --clobber
          else
            gh release create "$PLUGIN_TAG" "$PLUGIN_ZIP" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "v${VERSION} — Optional Network Metadata Plugin" \
              --notes-file plugin-release-notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Automatic ASN / IP Geolocation" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Automatic ASN / IP Geolocation" \
              --notes-file release-notes.md
          fi

          # Remove a formerly co-published plugin ZIP from the main release.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$PLUGIN_ZIP"; then
            gh release delete-asset "$TAG" "$PLUGIN_ZIP" --yes
          fi

          ASSET_COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$ASSET_COUNT" -ne 1 ]; then
            echo "::error::Main Komari release must contain exactly one theme ZIP, found ${ASSET_COUNT}"
            exit 1
          fi
          gh release view "$TAG" --json assets --jq '.assets[0].name' | grep -Fx "$ZIP"
