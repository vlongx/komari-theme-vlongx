name: Build Komari Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-gpu-${VERSION}-komari.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-gpu-${{ steps.meta.outputs.version }}-komari
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 GPU v${VERSION}

          基于 Tasogare v1.2.2 整合并增强。

          ### 本次修复
          - 每张节点卡片固定显示系统、ASN、IPv4/IPv6 三行信息。
          - 未配置 ASN、IPv4/IPv6 归属时明确显示“待配置”，不再隐藏信息行。
          - 系统版本和 ASN 长文本支持换行，窄屏也能看到完整信息。
          - 通过节点标签 asn:、ipv4:、ipv6: 补全真实公开元数据。
          - 保留 GPU/iGPU、延迟/丢包、月流量周期和 v2.2.4 资源卡片布局。

          ### 安装
          下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          EOF

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Always-visible Node Metadata" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Always-visible Node Metadata" \
              --notes-file release-notes.md
          fi
